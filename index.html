<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Генератор телефонных номеров</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#080808;--cd:#171717;--ln:#343434;--tx:#f7f7f7;--mu:#929292;--gl:#eeeeee}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:500 15px -apple-system,"SF Pro Display",Roboto,"Segoe UI",sans-serif;height:100dvh;overflow:hidden}
#app{display:flex;flex-direction:column;height:100dvh;padding-top:env(safe-area-inset-top)}
button{font:inherit;color:inherit;border:0;cursor:pointer;background:none}
button:disabled{opacity:.35;pointer-events:none}
.top{display:flex;justify-content:space-between;align-items:center;padding:14px 18px 8px}.earnbar{margin:3px 16px 8px;padding:11px 14px;border:1px solid #293553;border-radius:15px;background:linear-gradient(110deg,#101010,#202020 55%,#111111);display:grid;grid-template-columns:1fr auto;gap:2px 8px;align-items:center;font-size:12px;color:#a1acc8}.earnbar b{font-size:17px;color:#f5f5f5;text-shadow:0 0 18px #ffffff30}.earnbar small{grid-column:1/-1;color:#66728f;font-size:10px}
.bal{font-size:22px;font-weight:800}.energy-mark{display:inline-grid;place-items:center;width:25px;height:25px;border-radius:9px;background:linear-gradient(135deg,#ffffff,#9d9d9d);color:#111;box-shadow:0 0 18px #ffffff22}.top small{color:var(--mu);font-size:12px}
.ic button{width:38px;height:38px;border-radius:50%;background:var(--cd);position:relative;font-size:16px}
#dot{position:absolute;top:2px;right:2px;width:12px;height:12px;border-radius:50%;background:#ff3b4e;display:none}
main{flex:1;overflow-y:auto;padding:0 16px 14px}
section{display:none}section.on{display:block}
.plate{margin:22px auto 0;width:min(350px,96%);min-height:94px;background:linear-gradient(145deg,#292929,#090909 68%);border:1px solid color-mix(in srgb,var(--gl) 70%,#777 10%);border-radius:22px;display:flex;align-items:center;color:#f8fbff;padding:15px 14px;box-shadow:0 0 34px -10px var(--gl),inset 0 1px 0 #ffffff22,0 14px 35px #0008;transition:box-shadow .4s,filter .25s,transform .25s}
.bd{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;margin-right:8px;flex:none;font-size:17px;background:#555}
.nm{flex:1;text-align:center;font:900 clamp(17px,5.5vw,25px)/1.15 ui-monospace,Menlo,Consolas,monospace;white-space:nowrap;letter-spacing:-1px;text-shadow:0 0 18px color-mix(in srgb,var(--gl) 55%,transparent)}
.nm span{display:inline-block;min-width:.35em;transition:filter .12s,transform .12s}.nm .blur{filter:blur(4px);opacity:.72;transform:translateY(-2px) scaleY(1.16)}.nm .locked{color:#fff;text-shadow:0 0 16px #ffffffaa}
@keyframes lk{from{transform:translateY(-8px) scale(1.3);color:#e33}to{transform:none}}
.rg{display:none}
.shake{animation:sh .075s infinite ease-in-out;will-change:transform;filter:contrast(1.1)}.reel-active{box-shadow:0 0 42px #ffffff35,inset 0 0 30px #ffffff0c}.plate.rolling::after{background:linear-gradient(180deg,transparent 15%,#ffffff18 45%,#fff8 50%,#ffffff18 55%,transparent 85%);animation:reelSweep .42s linear infinite;mix-blend-mode:screen}@keyframes reelSweep{from{transform:translateY(-100%)}to{transform:translateY(100%)}}
@keyframes sh{0%,100%{transform:translate(0,0) rotate(0)}25%{transform:translate(-1px,.5px) rotate(-.15deg)}75%{transform:translate(1px,-.5px) rotate(.15deg)}}
.pop{animation:pp .5s}
@keyframes pp{0%{transform:scale(.8);opacity:.4}60%{transform:scale(1.07)}100%{transform:none;opacity:1}}
.tag{text-align:center;height:18px;margin-top:26px;font-weight:800;letter-spacing:2px;font-size:12px;color:#ff6bd6}
.rar{text-align:center;font-size:32px;font-weight:800;margin-top:4px}
.ser{text-align:center;color:var(--mu);font-size:12px;font-weight:700;margin-top:4px}
.val{text-align:center;font-size:30px;font-weight:800;margin:2px 0 14px}
.lvl{display:flex;justify-content:space-between;border-top:1px solid var(--ln);padding-top:12px;font-size:14px}.lvl span:last-child{color:var(--mu)}
.bar{height:4px;background:var(--ln);border-radius:4px;margin:10px 0 14px}.bar i{display:block;height:100%;background:#fff;border-radius:4px;transition:width .4s}
.row2{display:flex;gap:10px;margin-top:14px}
.pill{flex:1;background:var(--cd);border-radius:22px;padding:14px 8px;font-weight:700;font-size:13px;text-align:center;line-height:1.25}
.pill small{display:block;color:var(--mu);font-weight:500}
.big{display:block;width:100%;margin-top:12px;padding:20px;border-radius:30px;background:linear-gradient(110deg,#ffffff,#d5d5d5 55%,#888888);color:#080808;font-size:18px;font-weight:900;box-shadow:0 8px 30px #ffffff22, inset 0 1px 0 #fff}
.big small{background:#bcbcbc;border-radius:12px;padding:3px 8px;margin-left:8px;font-size:12px}.custom-glyph{display:inline-grid;place-items:center;width:23px;height:23px;border-radius:8px;background:#6f42c1;color:#fff;margin-right:5px;font-size:18px}
.card{background:linear-gradient(135deg,#1a2038,#111626);border:1px solid #354166;border-radius:18px;padding:12px 14px;margin-top:10px;display:flex;align-items:center;gap:10px}
.card .bd{width:36px;height:36px;margin:0;font-size:15px}.card b{display:block;font-family:ui-monospace,Menlo,monospace}.card small{color:var(--mu)}.card>div{flex:1;min-width:0}
.sm{background:#2a2a36;border-radius:14px;padding:8px 12px;font-size:13px;font-weight:700;white-space:nowrap}.sm.g{background:#eeeeee;color:#111}
h3{margin:16px 2px 4px;font-size:13px;color:var(--mu);text-transform:uppercase;letter-spacing:1px}
.pr{height:5px;background:var(--ln);border-radius:5px;margin-top:6px}.pr i{display:block;height:100%;background:#b46cff;border-radius:5px}
.chips{display:flex;gap:8px;margin:14px 0 4px}.chips button{flex:1;padding:10px;border-radius:16px;background:var(--cd);font-size:13px}.chips .a{background:#eeeeee;color:#111;font-weight:700}
nav{display:flex;align-items:center;gap:6px;margin:0 14px calc(10px + env(safe-area-inset-bottom));background:var(--cd);border-radius:32px;padding:7px 8px}
nav button{flex:1;padding:12px 4px;border-radius:24px;color:var(--mu);font-size:13px;font-weight:700}nav button.on{background:#2c2c38;color:#fff}
nav .av{flex:none;width:40px;height:40px;padding:0;background:linear-gradient(135deg,#d58bff,#8a5cff);color:#fff;border-radius:50%;overflow:hidden}
.ov{position:fixed;inset:0;background:var(--bg);z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px;text-align:center;gap:14px}
.logo{width:96px;height:96px;border-radius:28px;background:linear-gradient(135deg,#f7f7f7,#666 48%,#1a1a1a);display:grid;place-items:center;font-size:48px;font-weight:900;box-shadow:0 10px 50px -8px #8a5cff;animation:fl 3s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-8px) rotate(-3deg)}}
.ov h1{margin:6px 0 0;font-size:30px}.ov p{margin:0;color:var(--mu)}
input{width:100%;max-width:320px;padding:16px;border-radius:18px;border:1px solid var(--ln);background:var(--cd);color:var(--tx);font:inherit;text-align:center}
#toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:#eeeeee;color:#111;padding:11px 18px;border-radius:20px;font-weight:700;opacity:0;transition:.3s;pointer-events:none;z-index:30;white-space:nowrap}#toast.on{opacity:1}
#cf{position:fixed;inset:0;pointer-events:none;z-index:25}
#sheet{position:fixed;inset:0;background:#000a;z-index:22;display:none;align-items:flex-end}#sheet.on{display:flex}
#sheet>div{width:100%;max-height:92dvh;overflow-y:auto;overscroll-behavior:contain;background:var(--cd);border-radius:26px 26px 0 0;padding:22px 20px calc(22px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:10px;touch-action:pan-y}
.dim{opacity:.35}

body::before{content:"";position:fixed;inset:-20%;z-index:-1;background:radial-gradient(40% 35% at 20% 25%,#ffffff13,transparent),radial-gradient(35% 30% at 80% 70%,#99999912,transparent),radial-gradient(30% 30% at 60% 15%,#ffffff0a,transparent);filter:blur(30px);animation:au 14s ease-in-out infinite alternate}
@keyframes au{to{transform:translate(4%,-3%) scale(1.15) rotate(6deg)}}
.plate{position:relative}
.plate::after{content:"";position:absolute;inset:0;border-radius:21px;background:linear-gradient(105deg,transparent 40%,rgba(255,255,255,.12) 50%,transparent 60%);background-size:250% 100%;animation:sn 3.5s linear infinite;pointer-events:none}
@keyframes sn{from{background-position:150% 0}to{background-position:-100% 0}}
.plate.holo::after{background:linear-gradient(105deg,transparent 30%,#ff6bd6bb 42%,#2ee6c5bb 50%,#ffd24cbb 58%,transparent 70%);background-size:250% 100%;mix-blend-mode:normal;opacity:.5}
.plate.leg::before{content:"";position:absolute;inset:-9px;border-radius:20px;background:conic-gradient(#ffffff,#777777,#eeeeee,#333333,#ffffff);filter:blur(12px);z-index:-1;animation:rt 3s linear infinite}
@keyframes rt{to{transform:rotate(360deg)}}
.fl{position:fixed;left:50%;top:36%;transform:translateX(-50%);font-size:32px;font-weight:900;z-index:40;pointer-events:none;animation:up 1.2s ease-out forwards;text-shadow:0 4px 22px #000}
@keyframes up{to{transform:translate(-50%,-90px) scale(1.3);opacity:0}}
.fx{position:fixed;inset:0;z-index:24;pointer-events:none;animation:fo .7s ease-out forwards}@keyframes fo{from{opacity:1}to{opacity:0}}
.qk{animation:qk .45s}@keyframes qk{20%{transform:translate(-6px,4px)}40%{transform:translate(6px,-4px)}60%{transform:translate(-4px,2px)}80%{transform:translate(3px,-2px)}}
section.on,.card{animation:fi .35s}@keyframes fi{from{opacity:0;transform:translateY(10px)}}
.big,.pill,nav button{transition:transform .12s}
.speedrow{display:flex;justify-content:center;gap:6px;margin:9px 0 0}.speedrow button{padding:7px 12px;border:1px solid var(--ln);border-radius:14px;color:var(--mu);font-size:12px;font-weight:700;background:#191919}.speedrow button.on{color:#101010;background:#f4f4f4;border-color:#f4f4f4}.speedrow svg{width:14px;height:14px;vertical-align:-3px;margin-right:4px}.bd .brandmark{width:29px;height:29px}.card .bd .brandmark{width:27px;height:27px}.big:active,.pill:active,nav button:active{transform:scale(.96)}
#spin{position:relative;overflow:hidden;width:auto}
#spin::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 32%,#ffffffbb 50%,transparent 68%);transform:translateX(-120%);animation:bs 2.1s infinite}@keyframes bs{to{transform:translateX(120%)}}
/* Suspenseful monochrome number reveal */
.plate.rolling{filter:contrast(1.12);transform:scale(1.025);box-shadow:0 0 42px #ffffff22,inset 0 0 30px #ffffff0c,0 16px 38px #000;}
.plate.rolling .nm{filter:blur(.2px);}
.nm .digit{display:inline-block;min-width:.36em;transition:filter .12s,transform .12s,opacity .12s;will-change:transform,filter}
.nm .digit.blur{filter:blur(5px);transform:translateY(-3px) scaleY(1.12);opacity:.78;text-shadow:0 0 12px #fff}
.nm .digit.locked{filter:blur(0);transform:translateY(0) scale(1);opacity:1;animation:digitLock .36s cubic-bezier(.18,.9,.25,1.35)}
@keyframes digitLock{0%{transform:translateY(-13px) scale(1.22);filter:blur(5px);opacity:.3}55%{transform:translateY(3px) scale(.94);filter:blur(1px)}100%{transform:none;filter:blur(0);opacity:1}}
.plate.rolling::after{background:linear-gradient(105deg,transparent 15%,#ffffff08 35%,#ffffff80 50%,#ffffff08 65%,transparent 85%);background-size:220% 100%;animation:rollshine .42s linear infinite}
@keyframes rollshine{from{background-position:130% 0}to{background-position:-120% 0}}
.plate.shake{animation:heavyShake .11s linear infinite}
@keyframes heavyShake{0%,100%{transform:translate(0,0) rotate(0) scale(1.015)}20%{transform:translate(-2px,1px) rotate(-.45deg) scale(1.02)}40%{transform:translate(2px,-1px) rotate(.45deg) scale(1.025)}60%{transform:translate(-1px,-1px) rotate(-.25deg) scale(1.02)}80%{transform:translate(1px,1px) rotate(.25deg) scale(1.015)}}
@media(prefers-reduced-motion:reduce){.plate.shake,.plate.rolling::after,#spin::after{animation:none!important}}

.rar{text-shadow:0 0 26px currentColor;transition:color .3s}
nav button{font-size:11px;padding:11px 2px;min-width:0;line-height:1.15}
nav button .navico{display:block;width:21px;height:21px;margin:0 auto 4px;opacity:.85}
nav button.on .navico{opacity:1;filter:drop-shadow(0 0 5px #b46cff)}
.brandmark{display:block;width:100%;height:100%}
.tg-badge{display:flex;align-items:center;gap:7px;margin:0 16px 4px;padding:8px 11px;border:1px solid #263d50;background:#101e2a;border-radius:13px;color:#8ed8ff;font-size:11px;font-weight:800;letter-spacing:.4px}.tg-badge svg{width:17px;height:17px;flex:none}.tg-badge span:last-child{margin-left:auto;color:var(--mu);font-weight:600;letter-spacing:0}.rankrow{display:flex;align-items:center;gap:10px}.ranknum{width:27px;text-align:center;font-weight:900;color:#c8c8d2}.rankface{width:35px;height:35px;border-radius:50%;display:grid;place-items:center;background:#29283a;font-weight:900;overflow:hidden}.rankname{flex:1;min-width:0}.rankname b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.rankname small{color:var(--mu)}.rankscore{font-weight:900;white-space:nowrap}.ranknote{color:var(--mu);font-size:12px;text-align:center;line-height:1.5;padding:12px}.tg-btn{background:#229ed9!important;color:white!important}.profile-hero{display:flex;align-items:center;gap:14px;padding:16px;background:linear-gradient(135deg,#242039,#171720 70%);border:1px solid #383044;border-radius:22px;margin-bottom:12px}
.profile-emblem{width:66px;height:66px;flex:none;border-radius:21px;display:grid;place-items:center;background:linear-gradient(145deg,#b46cff,#5b5be8 60%,#2ee6c5);box-shadow:0 8px 30px #8a5cff35}
.profile-emblem svg{width:44px;height:44px}
.profile-name{font-size:20px;font-weight:850;overflow-wrap:anywhere}
.profile-sub{font-size:12px;color:var(--mu);margin-top:4px}
.profile-stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin:12px 0}
.statbox{padding:13px;background:var(--cd);border:1px solid #242431;border-radius:16px;min-width:0}
.statbox small{display:block;color:var(--mu);font-size:11px;margin-bottom:5px}
.statbox b{font-size:18px;overflow-wrap:anywhere}
#profileNick{max-width:none;text-align:left;padding:13px}
@media(max-width:370px){main{padding-left:11px;padding-right:11px}.top{padding-left:13px;padding-right:13px}.nm{font-size:20px}.plate{padding:7px 5px}.bd{width:34px;height:34px}.rg{font-size:12px}nav{margin-left:8px;margin-right:8px;gap:2px;padding:6px}nav button{font-size:10px}}
.rankrow{border:1px solid #2c3657;background:linear-gradient(120deg,#1b2037,#101525)}.ranknum{font-weight:900;color:#ffd66b;font-size:20px;min-width:24px}.rankscore{font-weight:900;color:#61e7c0;white-space:nowrap}.rankface{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#ff4d8d,#6c5cff);font-weight:900}.rankname{flex:1;min-width:0}.rankname small{display:block;color:var(--mu);font-size:11px}.tg-badge{color:#7bd5ff}

/* Refinement pass: fixed-size operator badges (never stretch into an oval). */
.card .bd{flex:0 0 38px!important;width:38px!important;min-width:38px!important;max-width:38px!important;height:38px!important;min-height:38px!important;max-height:38px!important;aspect-ratio:1/1;border-radius:12px;overflow:hidden;padding:0;}
.card .bd .brandmark{display:block;width:100%;height:100%;max-width:100%;max-height:100%;object-fit:contain;}
.plate .bd{flex:0 0 44px;width:44px;height:44px;overflow:hidden;border-radius:14px;padding:0}
.plate .bd .brandmark{display:block;width:100%;height:100%;object-fit:contain}
.plate::before{content:"";position:absolute;inset:-4px;border-radius:24px;z-index:-1;opacity:0;filter:blur(13px);transition:opacity .35s,background .35s}
.plate.rarity-rare::before{opacity:.4;background:#4b8dff}
.plate.rarity-epic::before{opacity:.7;background:#a855f7}
.plate.rarity-legendary::before{opacity:.92;background:#f5b82e;filter:blur(16px)}
.plate.rarity-epic{border-color:#b86bff;box-shadow:0 0 25px #b86bff33,inset 0 1px 0 #ffffff22,0 14px 35px #0008}
.plate.rarity-legendary{border-color:#ffc857;box-shadow:0 0 34px #ffc85755,inset 0 1px 0 #ffffff55,0 14px 35px #0008}
.plate.rarity-legendary::after{background:linear-gradient(105deg,transparent 28%,#fff3ba 46%,#ffc857aa 50%,transparent 67%);background-size:250% 100%;animation:sn 1.4s linear infinite}
.plate.rarity-rare::after{background:linear-gradient(105deg,transparent 28%,#a5d3ff 46%,#4b8dffbb 50%,transparent 67%);background-size:250% 100%;animation:sn 1.9s linear infinite}
.plate.rarity-epic::after{background:linear-gradient(105deg,transparent 28%,#d9a4ff 46%,#8b5cf6aa 50%,transparent 67%);background-size:250% 100%;animation:sn 1.7s linear infinite}
.rar{transition:color .25s,text-shadow .25s}.rar[data-rarity="3"]{text-shadow:0 0 22px #b86bff88}.rar[data-rarity="4"]{text-shadow:0 0 25px #ffc857aa}
.nm .reel-cell{display:inline-block;vertical-align:middle;height:1.15em;line-height:1.15;overflow:hidden;min-width:.52em;border-radius:3px;position:relative;color:#fff;filter:drop-shadow(0 0 5px #fff2)}
.nm .reel-strip{display:flex;flex-direction:column;line-height:1.15;will-change:transform;transition:transform 60ms linear}
.nm .reel-strip span{display:block;height:1.15em;line-height:1.15;min-height:1.15em}
.nm .reel-cell.blur{filter:blur(1.8px);opacity:.78;text-shadow:0 0 12px #ffffffb8}
.nm .reel-cell.locked{filter:drop-shadow(0 0 8px var(--gl));opacity:1}
.nm .separator{display:inline-block;min-width:.25em}
.plate.shake{animation:plateJolt .095s linear infinite}
@keyframes plateJolt{0%{transform:translate(0,0) rotate(0)}25%{transform:translate(-1.5px,.8px) rotate(-.18deg)}50%{transform:translate(1.4px,-.7px) rotate(.16deg)}75%{transform:translate(-.8px,-1px) rotate(-.12deg)}100%{transform:translate(1px,.6px) rotate(.12deg)}}
body.reduce-shake .plate.shake{animation:none!important}
.plate.rolling{border-color:var(--gl);box-shadow:0 0 42px color-mix(in srgb,var(--gl) 42%,transparent),inset 0 0 40px #ffffff0b,0 14px 35px #0008}
.plate.rolling .nm{letter-spacing:-.7px}
.plate.rolling::after{background:linear-gradient(180deg,transparent 12%,#ffffff08 35%,#ffffff70 50%,#ffffff08 65%,transparent 88%);animation:reelSweep .34s linear infinite;mix-blend-mode:screen}
@keyframes rarePulse{0%,100%{filter:drop-shadow(0 0 0 var(--gl))}50%{filter:drop-shadow(0 0 11px var(--gl))}}
.plate.rarity-epic .nm,.plate.rarity-legendary .nm{animation:rarePulse 1.2s ease-in-out 2}
.energy-note{font-size:11px;color:var(--mu);line-height:1.5;margin:5px 2px 8px}
.rankrow:nth-child(1){border-color:#ffc857;background:linear-gradient(115deg,#342b17,#171510);box-shadow:inset 0 0 18px #ffc8570c}
.rankrow:nth-child(2){border-color:#a7b1bf}.rankrow:nth-child(3){border-color:#c68b61}
@media(prefers-reduced-motion:reduce){.nm .reel-strip,.plate.rarity-epic .nm,.plate.rarity-legendary .nm{animation:none!important;transition:none!important}}


/* Polished settings controls and full information dossier */
.setting-block{margin-top:12px;padding:14px;border:1px solid var(--ln);border-radius:18px;background:linear-gradient(140deg,color-mix(in srgb,var(--cd) 94%,#777 6%),var(--cd));display:grid;gap:13px}
.setting-row{display:grid;grid-template-columns:minmax(0,1fr);gap:8px;padding-bottom:12px;border-bottom:1px solid color-mix(in srgb,var(--ln) 72%,transparent)}
.setting-row:last-child{padding-bottom:0;border-bottom:0}
.setting-label{font-weight:750;font-size:14px;display:flex;align-items:center;gap:9px}
.setting-label svg{width:20px;height:20px;flex:none;opacity:.9}
.setting-help{font-size:11px;color:var(--mu);line-height:1.45;margin-left:29px;margin-top:-4px}
.theme-select-wrap{position:relative;width:100%;min-width:0}
.theme-select-trigger{display:flex;align-items:center;gap:11px;width:100%;padding:12px;border:1px solid var(--ln);border-radius:15px;background:color-mix(in srgb,var(--cd) 82%,#7f7f7f 18%);text-align:left;min-height:52px;transition:border-color .18s,background .18s,transform .12s}
.theme-select-trigger:active{transform:scale(.99)}
.theme-preview{width:32px;height:32px;flex:none;border-radius:10px;border:1px solid #ffffff22;display:grid;place-items:center;overflow:hidden}
.theme-preview svg{width:20px;height:20px}
.theme-trigger-copy{flex:1;min-width:0}.theme-trigger-copy b{display:block;font-size:13px}.theme-trigger-copy small{display:block;color:var(--mu);font-size:11px;margin-top:2px}
.theme-chevron{width:18px;height:18px;flex:none;transition:transform .2s}.theme-select-trigger[aria-expanded="true"] .theme-chevron{transform:rotate(180deg)}
.theme-menu{position:relative;z-index:9;width:100%;margin-top:7px;padding:5px;border:1px solid var(--ln);border-radius:17px;background:var(--cd);box-shadow:0 16px 32px #0005;animation:menuIn .18s ease-out}
.theme-menu[hidden]{display:none!important}

if(!S.user){$('nick').value=TU?(TU.first_name||'').slice(0,16):'';if(TU){$('welcomeText').innerHTML='Профиль Telegram подключён<br>Ник можно изменить позже';$('go').classList.add('tg-btn')} $('reg').style.display='flex'}

var BOT_USER='RandomNumberPhoneBot',REF=(new URLSearchParams(location.search).get('ref')||((tg&&tg.initDataUnsafe&&tg.initDataUnsafe.start_param)||'').replace('ref_','')||''),pushT=0,pendBonus=null;
function cloudPush(){if(!telegramMode)return;clearTimeout(pushT);pushT=setTimeout(async()=>{try{const r=await fetch(API_BASE+'/api/state',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({initData:tg.initData,state:S,ts:S.ts})});const d=await r.json();if(d.state&&d.ts>S.ts)applyCloud(d)}catch(e){}},800)}
function applyCloud(d){const s=Object.assign(fresh(),d.state);s.up=Object.assign(fresh().up,s.up||{});s.rf=Array.isArray(s.rf)?s.rf:[0,0,0,0,0];s.col=Array.isArray(s.col)?s.col:[];s.q=s.q||{};S=s;S.ts=d.ts;try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}regen();hud();rend();toast('Прогресс синхронизирован')}
async function cloudPull(){if(!telegramMode)return;try{const r=await fetch(API_BASE+'/api/state?initData='+encodeURIComponent(tg.initData)+'&ref='+encodeURIComponent(REF));const d=await r.json();if(d.exists&&d.ts>(S.ts||0))applyCloud(d);else cloudPush();if(d.bonus&&(d.bonus.en||d.bonus.cash)){if(!S.user)pendBonus=d.bonus;else{S.en+=d.bonus.en||0;S.cash=(S.cash||0)+(d.bonus.cash||0);toast('Бонус за приглашение: +'+(d.bonus.en||0)+' энергии'+(d.bonus.cash?' и '+fmt(d.bonus.cash)+' ₽':''));save();hud()}}}catch(e){}}

cloudPull();setTimeout(refClaim,3500);

// ---------- новый рейтинг и меню шаринга ----------
const shortMoney=n=>n>=1e9?(n/1e9).toFixed(1).replace('.0','')+' млрд':n>=1e6?(n/(n>=1e8?1e6:1e6)).toFixed(n>=1e8?0:1).replace('.0','')+' млн':fmt(n);
let rkBusy=false;
async function loadLeaderboard(){const meta=$('rankMeta'),box=$('rankList'),me=$('rankMe');if(rkBusy)return;rkBusy=true;meta.textContent='Обновляем рейтинг…';
 try{const r=await fetch(API_BASE+'/api/leaderboard?limit=100'+(telegramMode?'&initData='+encodeURIComponent(tg.initData):''),{cache:'no-store'});if(!r.ok)throw 0;const d=await r.json(),list=d.items||[];
  const wealth=S.col.reduce((a,n)=>a+(n.v||0),0)+(S.cash||0);
  const val=u=>shortMoney(u.scoreValue||0)+' ₽',sub=u=>`Уровень ${fmt(u.level||1)} · ${fmt(u.spins||0)} прокруток`,mine=u=>String(u.id)===UID;
  const row=(u,i,cls)=>`<div class="${cls}${mine(u)?' rk-me':''}"><span class="rk-m">${i+1}</span><div class="rk-a">${esc((u.name||'И')[0].toUpperCase())}</div><div class="rk-i"><b><span>${esc(u.name||'Игрок')}</span><i class="rk-c">RUS</i></b><small>${sub(u)}</small></div><div class="rk-v">${val(u)}</div></div>`;
  const rest=(u,i)=>`<div class="rk-r ${mine(u)?'rk-me':''}"><em>${i+4}</em><div class="rk-a">${esc((u.name||'И')[0].toUpperCase())}</div><div class="rk-i"><b><span>${esc(u.name||'Игрок')}</span><i class="rk-c">RUS</i></b><small>${sub(u)}</small></div><div class="rk-v">${val(u)}</div></div>`;
  meta.textContent=list.length?`Игроков в рейтинге: ${fmt(d.total||list.length)} · баланс + стоимость номеров`:'Пока никого нет — стань первым';
  const nm=esc(S.user?.name||TU?.first_name||'Ты');
  me.innerHTML=`<div class="card rankme" style="outline:1px solid #8b6cff;margin-bottom:12px"><div class="rankface" style="background:linear-gradient(145deg,#b46cff,#3730a3)">${nm.slice(0,1).toUpperCase()}</div><div><b style="font-family:inherit">${nm}</b><small>${d.me?`Твоё место: ${fmt(d.me.rank)}`:'Продолжай играть — и ты появишься в рейтинге'}</small></div><b>${money(d.me?d.me.scoreValue:wealth)} ₽</b></div>`;
  box.innerHTML=list.slice(0,3).map((u,i)=>row(u,i,'rk-p n'+(i+1))).join('')+(list.length>3?`<div class="rk-l">${list.slice(3).map(rest).join('')}</div>`:'')
 }catch(e){meta.textContent='Не удалось получить рейтинг. Проверь сервер.'}finally{rkBusy=false}}
async function shareNum(n){n=n||S.pend||S.col.slice().sort((a,b)=>b.v-a.v)[0];if(!n){toast('Сначала выбей номер');return}
 const num=((n.pre||'')+' '+n.num).trim(),body={number:num,rarity:n.r,value:n.v,op:n.op||'',why:whyTxt(n)};
 // 1) фото-карточка в выбранный чат (Telegram 8.0+): открывается список чатов, уходит картинка + цена + @юзернейм бота
 if(telegramMode&&tg.shareMessage&&(!tg.isVersionAtLeast||tg.isVersionAtLeast('8.0'))){
  try{toast('Готовим карточку…');const r=await fetch(API_BASE+'/api/share',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.assign({initData:tg.initData},body))});const d=await r.json();
   if(d&&d.ok&&d.id){tg.shareMessage(d.id,ok=>{if(ok)toast('Отправлено')});return}}catch(e){}}
 // 2) запасной вариант: ссылка, которая в чате разворачивается в ту же картинку
 const q=new URLSearchParams({num,r:n.r,v:n.v,op:n.op||'',why:whyTxt(n)}),link='https://t.me/'+BOT_USER+'?start=ref_'+UID,text='Номер за '+fmt(n.v)+' ₽. А какой выпадет тебе?\n@'+BOT_USER;
 const u=location.origin+'/s?'+q+'&to='+encodeURIComponent(link),url='https://t.me/share/url?url='+encodeURIComponent(u)+'&text='+encodeURIComponent(text);
 if(tg&&tg.openTelegramLink)tg.openTelegramLink(url);else window.open(url,'_blank')}
$('share').onclick=()=>shareNum();

// ---------- реферальная система (в профиле) ----------
const REF_MSG='Залетай в НомерГрам: крути номера, лови легендарные и стань самым богатым! Дарю +50 энергии и 25 000 ₽ на старт';
const refLink=()=>'https://t.me/'+BOT_USER+'?start=ref_'+UID;
function refShare(){const url='https://t.me/share/url?url='+encodeURIComponent(refLink())+'&text='+encodeURIComponent(REF_MSG);if(tg&&tg.openTelegramLink)tg.openTelegramLink(url);else window.open(url,'_blank')}
function refCopy(){const l=refLink();try{navigator.clipboard.writeText(l).then(()=>toast('Ссылка скопирована'),()=>toast(l))}catch(e){toast(l)}}
const giftTxt=g=>g?[g.en?`+${g.en} эн.`:'',g.cash?`+${fmt(g.cash)} ₽`:'',g.tk?`+${g.tk} билет колеса`:''].filter(Boolean).join(' · '):'';
function applyRefReward(t){if(!t||!(t.en||t.cash||t.tk))return false;S.en+=t.en||0;S.cash=(S.cash||0)+(t.cash||0);S.tk=(S.tk||0)+(t.tk||0);save();hud();rend();toast('Награда за друзей: '+giftTxt(t));nt('success');return true}
async function refClaim(){if(!telegramMode)return;try{const r=await fetch(API_BASE+'/api/friends/claim',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({initData:tg.initData})});const d=await r.json();if(d.ok)applyRefReward(d.reward)}catch(e){}}
function refHtml(d){const pf=d?d.perFriend:{en:30,cash:20000},fb=d?d.friendBonus:{en:50,cash:25000},nx=d&&d.nextMilestone,n=d?d.activeSpins:3;
 return`<div class="refgrid"><div><small>Приглашено</small><b>${d?d.count:0}</b></div><div><small>Активных</small><b>${d?d.active:0}</b></div></div>
 <p>Друг получает <b>${giftTxt(fb)}</b> на старт. Ты — <b>${giftTxt(pf)}</b> за каждого, кто сделал ${n} прокрутки.${nx?` Бонус за ${nx} активных друзей: <b>${giftTxt(d.milestones[nx])}</b>.`:''}</p>
 <div class="reflink">${esc(refLink())}</div>
 <div class="row2"><button class="pill" id="refCopy">Скопировать</button><button class="big" id="refShare" style="margin:0;flex:2">Поделиться</button></div>
 ${d&&d.friends.length?`<div class="reflist">${d.friends.map(f=>`<div><span>${esc(f.name)}</span><i class="${f.active?'ok':''}">${f.active?'играет':'ещё не играл'}</i></div>`).join('')}</div>`:''}`}
async function loadRef(){const box=$('refbox');if(!box)return;let d=null;
 if(telegramMode){try{await refClaim();const r=await fetch(API_BASE+'/api/friends?initData='+encodeURIComponent(tg.initData));if(r.ok)d=await r.json()}catch(e){}}
 box.innerHTML=refHtml(d);$('refShare').onclick=refShare;$('refCopy').onclick=refCopy}
// ---------- мгновенная продажа в «Игре» (подтверждение — только в коллекции) ----------
function sell(){if(busy||!S.pend)return;const n=S.pend;S.cash=(S.cash||0)+n.v;S.earned=(S.earned||0)+n.v;S.pend=null;S.sold++;ev('sell');save();idle();toast(`Продано за ${fmt(n.v)} ₽`);fl(`+${fmt(n.v)} ₽`,'#55efbd');cashCounter(n.v);hud();rend()}
// ---------- почему номер столько стоит ----------
function whyList(n){const d=String(n.num).replace(/\D/g,''),s=d.slice(-7),t6=s.slice(1),f=s.slice(3),out=[],rev=x=>[...x].reverse().join('');
 if(n.tag=='Shadow')out.push(['Теневой номер — крайне редкий','×100']);else if(n.tag)out.push(['Анонимный номер Telegram','×35']);
 if(new Set(t6).size==1)out.push(['Шесть одинаковых цифр в конце']);else if(seq(t6))out.push(['Лестница из шести цифр в конце']);
 else if(new Set(f).size==1)out.push(['Четыре одинаковые цифры в конце']);
 else if(f.slice(0,2)==f.slice(2))out.push([`Дубль в конце: ${f.slice(0,2)} ${f.slice(2)}`]);
 else if(f==rev(f))out.push(['Зеркальный хвост '+f]);else if(seq(f))out.push(['Лесенка в конце: '+f]);
 else{let p=0;for(let i=0;i<6;i++)if(s[i]==s[i+1])p++;if(p)out.push([p>1?`Парные цифры (${p})`:'Парная цифра подряд'])}
 if(/000$/.test(s))out.push(['Тысячное окончание 000']);else if(/00$/.test(s))out.push(['Круглое окончание 00']);
 const sev=[...s].filter(c=>c=='7').length;if(sev>=3)out.push([`Счастливые семёрки · ${sev}`]);
 const o=OPS.find(x=>x[0]==n.op);if(o&&o[4]>1)out.push([n.k=='t'?'Бесплатный номер 8-800':n.k=='c'?'Городской код'+(n.reg?': '+n.reg:''):'Премиум-оператор '+n.op,'×'+o[4]]);
 if(!out.length||(n.r==0&&out.length==0))out.push(['Случайная комбинация без красивых повторов']);
 if(n.mk&&Math.abs(n.mk-1)>=.05)out.push([n.mk>1?'Рынок: спрос выше':'Рынок: спрос ниже','×'+String(n.mk).replace('.',',')]);out.push([`База: ${RAR[n.r][0]}`,fmt(RAR[n.r][2])+' ₽']);return out}
const whyTxt=n=>whyList(n).filter(x=>x[0].indexOf('База')<0&&x[0].indexOf('Рынок')<0).slice(0,2).map(x=>x[0]).join(' · ')||RAR[n.r][0];
function renderWhy(n){let w=$('why');if(!w){w=document.createElement('div');w.id='why';w.className='wy';$('val').insertAdjacentElement('afterend',w)}
 w.innerHTML=n?whyList(n).map((x,i)=>`<i style="animation-delay:${.15+i*.09}s">${esc(x[0])}${x[1]?`<b>${x[1]}</b>`:''}</i>`).join(''):''}
const _show=show,_idle=idle;
function renderPL(n){let w=$('pl');if(!w){w=document.createElement('div');w.id='pl';w.className='pl';$('val').insertAdjacentElement('afterend',w)}
 if(!n||n.fee==null){w.textContent='';w.className='pl';return}const d=n.v-n.fee;w.className='pl '+(d>=0?'up':'dn');w.textContent=d>=0?`Прибыль с прокрутки: +${fmt(d)} ₽`:`Убыток с прокрутки: −${fmt(-d)} ₽`}
show=function(n){_show(n);renderWhy(n);renderPL(n);const v=$('val'),t0=performance.now(),D=650;v.classList.remove('vpop');void v.offsetWidth;v.classList.add('vpop');
 (function step(t){const k=Math.min(1,(t-t0)/D),e=1-Math.pow(1-k,3);v.textContent=fmt(Math.round(n.v*e))+' ₽';if(k<1)requestAnimationFrame(step)})(t0)};
idle=function(){_idle();renderWhy(null);renderPL(null)};
// горячие клавиши на ПК: Пробел — крутить, S — продать, K — оставить
addEventListener('keydown',e=>{if(/INPUT|TEXTAREA/.test((e.target||{}).tagName))return;const m={' ':'spin',s:'sell',ы:'sell',k:'keep',л:'keep'}[e.key.toLowerCase()];if(m&&!$(m).disabled){e.preventDefault();$(m).click()}});

// ---------- подарок дня (колокольчик): серия до 7 дней, на 3-й и 7-й день гарант номера ----------
$('bell').onclick=()=>{const y=new Date(Date.now()-864e5).toISOString().slice(0,10);
 if(S.ld===today()){toast(`Серия входов: ${S.st} дн. Подарок уже получен`);return}
 const st=S.ld===y?Math.min(S.st+1,7):1,en=[10,15,20,25,30,40,50][st-1],g=(st==3||st==7)?gen(st==7?3:2):null;
 const d=document.createElement('div');d.className='gift';
 d.innerHTML=`<div><small style="opacity:.6;letter-spacing:.15em">СЕРИЯ ${st} ДНЕЙ</small><h2>Подарок дня</h2><div class="big">+${en} ⚡</div>${g?`<div style="color:${RAR[g.r][3]};font-weight:700">+ гарант: ${RAR[g.r][0]} номер</div>`:`<small style="opacity:.6">На 3-й и 7-й день — гарантированный номер</small>`}<div class="days">${[1,2,3,4,5,6,7].map(i=>`<i class="${i<=st?'d':''}">${i<=st?'✓':i}</i>`).join('')}</div><button>Забрать</button></div>`;
 document.body.appendChild(d);nt('success');confetti(g?RAR[g.r][3]:'#ffc857');
 d.querySelector('button').onclick=()=>{d.remove();S.st=st;S.ld=today();S.en+=en;if(g){S.col.push(g);S.rf[g.r]=(S.rf[g.r]||0)+1;if(g.v>(S.bestNumberValue||0)){S.bestNumberValue=g.v;S.bestNumber=g}}save();hud();rend();toast(`+${en} энергии${g?' и номер '+g.pre+' '+g.num:''}`)}};
})();
